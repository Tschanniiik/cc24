  const g = Math.min(W * .62, H * .42), cx = W / 2, cy = H * .54;
  const rs = Math.max(3, g / 46);
  const bowL = { x: cx - g*.17, y: cy - g*.37, a: -.45 }, bowR = { x: cx + g*.17, y: cy - g*.37, a: .45 };
  const inEll = (x, y, b, rx, ry) => { const dx = x - b.x, dy = y - b.y, c = Math.cos(b.a), s = Math.sin(b.a);
    const u = dx*c + dy*s, v = -dx*s + dy*c; return (u*u)/(rx*rx) + (v*v)/(ry*ry) <= 1; };
  const partAt = (x, y) => {
    const ax = Math.abs(x - cx);
    if (y >= cy - g*.11 && y <= cy + g*.46 && ax <= g*.42) return ax <= g*.07 ? 2 : 1;
    if (y >= cy - g*.27 && y <= cy - g*.14 && ax <= g*.5) return ax <= g*.07 ? 4 : 3;
    for (const b of [bowL, bowR]) if (inEll(x, y, b, g*.2, g*.1) && !inEll(x, y, b, g*.13, g*.055)) return 5;
    if ((x-cx)**2 + (y-(cy-g*.3))**2 <= (g*.055)**2) return 5;
    return 0;
  };
  const y0 = cy - g*.5, y1 = cy + g*.46, x0 = cx - g*.55, x1 = cx + g*.55, st = .5;
  let total = 0;
  for (let y = y0; y <= y1; y += rs) for (let x = x0; x <= x1; x += st) if (partAt(x, y)) total += st;
  const d = total / N; let acc = 0, k = 0;
  for (let y = y0; y <= y1 && k < N; y += rs) for (let x = x0; x <= x1 && k < N; x += st) {
    const p = partAt(x, y); if (!p) continue;
    acc += st; if (acc < d) continue; acc -= d;
    const q = P[k++], t = (y - y0) / (y1 - y0);
    q.gx = x; q.gy = y; q.part = p;
    q.gc = p === 2 || p === 4 ? [255, 210, 120] : p === 5 ? [255, 175 - t*60, 95] : p === 3 ? [255, 95, 85] : [235 + t*20, 55 + t*55, 70];
  }
  while (k < N) { const src = P[(Math.random() * k) | 0], q = P[k++]; Object.assign(q, { gx: src.gx, gy: src.gy, part: src.part, gc: src.gc }); }
  const R = Math.hypot(W, H) * .6, bTop = cy - g*.11, bBot = cy + g*.46;
  for (const q of P) {
    const a = Math.random() * 6.283, r = R * (.7 + Math.random() * .5);
    q.ix = cx + Math.cos(a) * r; q.iy = cy + Math.sin(a) * r;
    // Reihenfolge: Korpus von unten nach oben, dann Deckel, zuletzt die Schleife
    const o = q.part <= 2 ? (bBot - q.gy) / (bBot - bTop) * .55 : q.part <= 4 ? .6 + Math.random() * .08 : .74 + Math.random() * .12;
    q.bd = o * 2.1 + Math.random() * .12;
  }
  gift = { g, cx, cy, rs, d };
}

let state = 'build', t0 = performance.now(), typed = false;
const BUILD = 3.3;
function go(s) { state = s; t0 = performance.now(); }

function open() {
  if (state === 'build') { if ((performance.now() - t0) / 1000 < BUILD - .4) return; }
  else if (state !== 'wait') return;
  hint.hidden = true;
  if (reduce) { for (const q of P) { q.x = layout.ox + q.tx * layout.s; q.y = layout.oy + q.ty * layout.s; } go('done'); return; }
  go('shake');
}
cv.addEventListener('pointerdown', open);
addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') open(); });
again.addEventListener('click', e => { e.stopPropagation(); again.classList.remove('show'); again.hidden = true; lineEl.textContent = ''; typed = false; buildGift(); go('build'); });

function typeText() {
  typed = true; lineEl.textContent = '';
  [...TEXT].forEach((ch, i) => { const s = document.createElement('span'); s.textContent = ch; s.style.animationDelay = (reduce ? 0 : i * .09) + 's'; lineEl.appendChild(s); });
  setTimeout(() => { again.hidden = false; requestAnimationFrame(() => again.classList.add('show')); }, reduce ? 0 : TEXT.length * 90 + 900);
}

const clamp = v => v < 0 ? 0 : v > 1 ? 1 : v;
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
const outC = t => 1 - Math.pow(1 - t, 3);
const mix = (a, b, t) => [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, a[2] + (b[2]-a[2])*t];
const rgba = (c, a) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const WHITE = [255, 245, 230];

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const t = (now - t0) / 1000;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#07060d'; ctx.fillRect(0, 0, W, H);
  for (const s of stars) { ctx.fillStyle = `rgba(235,225,255,${.25 + .35 * (.5 + .5*Math.sin(now/1000*s.sp + s.tw))})`; ctx.fillRect(s.x*W, s.y*H, s.r, s.r); }
  ctx.globalCompositeOperation = 'lighter';
  const { s: sc, ox, oy } = layout;
  const drag = Math.exp(-2.3 * dt);

  if (state === 'build' || state === 'wait' || state === 'shake') {
    const { g, cx, cy, rs, d } = gift;
    let jx = 0, jy = 0, lift = 0, glowA = 1;
    if (state === 'build') { glowA = clamp((t - 1.6) / 1.5); if (t > BUILD) { go('wait'); hint.hidden = false; } }
    else jy = Math.sin(now / 1000 * 2) * 3;
    if (state === 'shake') { const a = Math.min(1, t / .9); jx = Math.sin(t * 55) * a * g * .02; lift = a * a * g * .05; }
    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, g * .9);
    glow.addColorStop(0, `rgba(255,90,80,${.1 * glowA})`); glow.addColorStop(1, 'rgba(255,90,80,0)');
    ctx.fillStyle = glow; ctx.fillRect(cx - g, cy - g, 2*g, 2*g);
    const W0 = d * 1.3, H0 = rs * .5;
    for (const q of P) {
      const up = q.part >= 3 ? lift : 0;
      let x = q.gx + jx, y = q.gy + jy - up, c = q.gc, a = .8, w = W0, h = H0;
      if (state === 'build') {
        const k = clamp((t - q.bd) / 1.05); if (!k) continue;
        const e = outC(k), rem = 1 - e, spin = rem * 1.8, dx = q.ix - q.gx, dy = q.iy - q.gy;
        const cs = Math.cos(spin), sn = Math.sin(spin);
        x = q.gx + (dx*cs - dy*sn) * rem; y = q.gy + (dx*sn + dy*cs) * rem;
        const flash = Math.max(0, 1 - Math.abs(k - .92) * 7);
        c = mix(WHITE, q.gc, clamp(k * 1.3)); a = .45 + .4 * k + .4 * flash;
        w = 1.4 + (W0 - 1.4) * clamp((k - .7) / .3); h = 1.4 + (H0 - 1.4) * clamp((k - .7) / .3);
      }
      q.x = x; q.y = y;
      ctx.fillStyle = rgba(c, a);
      ctx.fillRect(x - w/2, y - h/2, w, h);
    }
    if (state === 'shake' && t > .9) {
      const sf = g / 300, bx = cx, by = cy - g * .05;
      for (const q of P) {
        const dx = q.x - bx, dy = q.y - by, ang = Math.atan2(dy, dx) + (Math.random() - .5) * 1.2;
        const lid = q.part >= 3, sp = (lid ? 450 + Math.random()*650 : 140 + Math.random()*500) * sf;
        q.vx = Math.cos(ang) * sp; q.vy = Math.sin(ang) * sp - (lid ? 480 : 240) * sf * Math.random();
        q.go = false;
      }
      go('burst');
    }
  } else if (state === 'burst' || state === 'form') {
    // Explosion; die Teilchen starten ihren Flug zum Bild aus der laufenden Bewegung heraus (kein Stillstand)
    const tb = state === 'burst' ? t : t + .8;
    const fade = Math.min(1, tb / .5), grav = 80 * gift.g / 300, dur = 2.1;
    const w = gift.d * 1.3 * (1 - fade) + 1.6 * fade, h = gift.rs * .5 * (1 - fade) + 1.6 * fade;
    const sz = Math.max(1, sc * 1.2);
    let doneAll = true;
    for (const q of P) {
      const tx = ox + q.tx * sc, ty = oy + q.ty * sc;
      if (state === 'form' && !q.go && t >= q.delay) { q.go = true; q.sx = q.x; q.sy = q.y; q.svx = q.vx; q.svy = q.vy; }
      if (!q.go) {
        doneAll = false;
        q.vx *= drag; q.vy = q.vy * drag + grav * dt; q.x += q.vx * dt; q.y += q.vy * dt;
        ctx.fillStyle = rgba(mix(q.gc, q.bc, fade), .85);
        ctx.fillRect(q.x - w/2, q.y - h/2, w, h);
        continue;
      }
      const k = clamp((t - q.delay) / dur); if (k < 1) doneAll = false;
      const k2 = k*k, k3 = k2*k, T = dur;
      const h00 = 2*k3 - 3*k2 + 1, h10 = k3 - 2*k2 + k, h01 = -2*k3 + 3*k2;
      q.x = h00*q.sx + h10*q.svx*T + h01*tx; q.y = h00*q.sy + h10*q.svy*T + h01*ty;
      const e = ease(k), s2 = w + (sz - w) * e;
      ctx.fillStyle = rgba(mix(q.bc, q.fc, e), .85);
      ctx.fillRect(q.x - s2/2, q.y - s2/2, s2, s2);
    }
    if (state === 'burst' && t > .8) go('form');
    else if (state === 'form' && doneAll) go('done');
  } else if (state === 'done') {
    const f = reduce ? 1 : outC(clamp(t / 1.4));
    ctx.globalAlpha = f; ctx.drawImage(strokes, 0, 0, W, H); ctx.globalAlpha = 1;
    const sz = Math.max(1, sc * 1.2);
    for (const q of P) {
      const tw = .5 + .5 * Math.sin(now / 1000 * 1.8 + q.tw);
      const a = (1 - f) * .85 + f * (tw * tw * .9);
      ctx.fillStyle = rgba(q.fc, a);
      ctx.fillRect(ox + q.tx * sc - sz/2, oy + q.ty * sc - sz/2, sz, sz);
    }
    if (!typed && t > .6) typeText();
  }
  requestAnimationFrame(frame);
}

resize(); buildGift();
addEventListener('resize', resize);
requestAnimationFrame(frame);
</script>

</body>
</html>
